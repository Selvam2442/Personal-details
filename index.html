<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK Websites | Code. Create. Conquer.</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary: #ff003c;
            --primary-hover: #ff3366;
            --bg-dark: #050505;
            --surface: rgba(25, 25, 25, 0.6);
            --surface-border: rgba(255, 0, 60, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 0, 60, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 60, 0.05) 0px, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        /* HERO SECTION */
        .hero {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 0, 60, 0.05);
        }

        /* BANNER (PERFECT 16:9 RATIO) */
        .banner {
            width: 100%;
            aspect-ratio: 16 / 9; /* This forces the 16:9 size dynamically */
            border-radius: 16px;
            background: url('banner.png') center/cover no-repeat;
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* LOGO */
        .logo-box {
            text-align: center;
            margin-top: -55px; /* Pulls logo up into the banner */
            position: relative;
            z-index: 2;
        }

        .logo-box img {
            width: 110px;
            height: 110px;
            border-radius: 25%; /* Slightly rounded square */
            border: 4px solid #111;
            background: #000;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.4);
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .logo-box img:hover {
            transform: scale(1.05);
        }

        /* TITLE */
        h1 {
            text-align: center;
            margin-top: 15px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff, #ff003c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* TYPING */
        .typing {
            text-align: center;
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 15px;
            font-weight: 300;
        }

        /* SOCIAL MEDIA BUTTONS */
        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 10px;
        }

        .social a {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social a:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 0, 60, 0.3);
            color: #fff;
        }

        /* CONTENT SECTIONS */
        section {
            width: 100%;
            max-width: 550px;
            margin: 0 auto 20px;
            padding: 20px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
        }

        /* TITLES */
        .section-title {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .section-title::before, .section-title::after {
            content: '';
            height: 2px;
            width: 30px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* CARD */
        .card {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,0,60,0.1), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .card:hover {
            background: rgba(255, 0, 60, 0.1);
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(255, 0, 60, 0.15);
        }

        .card:hover::before {
            transform: translateX(100%);
        }

        .price-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 5px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .modal-box {
            background: #111;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 1px solid var(--primary);
            box-shadow: 0 10px 40px rgba(255, 0, 60, 0.3);
            transform: scale(0.9);
            animation: scaleUp 0.3s forwards;
        }

        @keyframes scaleUp {
            to { transform: scale(1); }
        }

        .modal-box h3 {
            margin-bottom: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-box a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 12px 0;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            transition: 0.2s;
        }

        .call { background: #222; border: 1px solid #333; }
        .wa { background: #25D366; color: #000 !important; }
        .mail { background: var(--primary); }

        .modal-box a:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .close {
            margin-top: 20px;
            cursor: pointer;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        
        .close:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="banner"></div>

        <div class="logo-box">
            <img src="logo.png" alt="MSK Logo">
        </div>

        <h1>MSK WEBSITES</h1>

        <div class="typing">
            > I build <span id="typing"></span>
        </div>

        <div class="social">
            <a href="https://wa.me/qr/PDXKKTQ4YR7VG1"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/alan_editxz/"><i class="fab fa-instagram"></i></a>
            <a href="mailto:selvam.m.s.k2442@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>

    </div>

    <section>
        <h2 class="section-title">Services</h2>
        <div class="grid">
            <div class="card">Business Website</div>
            <div class="card">Portfolio</div>
            <div class="card">Responsive Design</div>
            <div class="card">Fast Loading</div>
        </div>
    </section>

    <section>
        <h2 class="section-title">Pricing</h2>
        <div class="grid">
            <div class="card" onclick="openModal('Business Website')">
                Business
                <span class="price-val">₹1k - 4k</span>
            </div>
            <div class="card" onclick="openModal('Profile Website')">
                Profile
                <span class="price-val">₹500 - 2.5k</span>
            </div>
        </div>
    </section>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="title">Order Service</h3>
            <a href="tel:+916380466535" class="call"><i class="fas fa-phone-alt"></i> Call Now</a>
            <a href="https://wa.me/qr/PDXKKTQ4YR7VG1" class="wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="mailto:selvam.m.s.k2442@gmail.com" class="mail"><i class="fas fa-envelope"></i> Email</a>
            <div class="close" onclick="closeModal()">[ Close ]</div>
        </div>
    </div>

    <script>
        new Typed('#typing', {
            strings: ['Modern Websites.', 'Clean UI.', 'Fast Experiences.', 'Digital Solutions.'],
            typeSpeed: 50,
            backSpeed: 30,
            loop: true,
            cursorChar: '_'
        });

        const modal = document.getElementById('modal');
        const title = document.getElementById('title');

        function openModal(name) {
            title.innerText = name;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = e => {
            if (e.target == modal) closeModal();
        }
    </script>

</body>

</html>
